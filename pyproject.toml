[project]
name = "ha-google-nest-thermostat"
version = "0.1.1"
description = "A polling Home Assistant integration for Google Nest thermostats"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff>=0.16.4,<0.17",
]

[tool.pytest.ini_options]
addopts = "-q --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
